<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#06060f">
    <title>MOSU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.module.min.js"
            }
        }
    </script>
</head>
<body>
    <div id="game"></div>

    <div id="hud" class="hidden">
        <div id="hud-top">
            <div id="hud-title"></div>
            <div id="hud-progress"><div id="hud-progress-fill"></div></div>
            <div id="hud-time"></div>
        </div>
        <div id="hud-left">
            <div id="hud-score">0</div>
            <div id="hud-acc">100.00%</div>
        </div>
        <div id="hud-right">
            <div id="hud-mult">x1.0</div>
            <button id="hud-pause" title="Pause (Esc)">❚❚</button>
        </div>
        <div id="hud-health"><div id="hud-health-fill"></div></div>
        <div id="hud-bottom">
            <div id="hud-combo"></div>
            <div id="hud-combo-label">COMBO</div>
        </div>
        <div id="judgement"></div>
        <div id="judgement-sub"></div>
        <div id="combo-burst"></div>
    </div>

    <div id="ui"></div>
    <div id="toasts"></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
